name: Estudo (testes históricos, não mexe nos robôs)
on:
  workflow_dispatch:
  push:
    paths: ["estudos/*.py"]
permissions:
  contents: write
concurrency:
  group: estudo
  cancel-in-progress: false
jobs:
  estudo:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Rodar o estudo
        run: |
          if git diff --name-only HEAD~1 HEAD | grep -q "estudos/vantagem.py"; then python3 estudos/vantagem.py; else python3 estudos/orb_fvg.py; fi
      - name: Guardar o resultado
        run: |
          git config user.name "sala-robos"; git config user.email "sala-robos@users.noreply.github.com"
          git add estudos/resultado_orb_fvg.json estudos/vantagem || true
          git commit -q -m "estudo: resultado" || exit 0
          for i in 1 2 3; do git pull -q --rebase && git push -q && exit 0; sleep 5; done
