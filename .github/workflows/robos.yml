name: Robôs (simulação, nenhuma ordem real)
on:
  workflow_dispatch:
  # A execução automática é ligada quando o Mac deixar de rodar os robôs:
  # schedule:
  #   - cron: "*/5 * * * *"
concurrency:
  group: robos
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  rodar:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Rodar os robôs (lê preços públicos; nenhuma ordem é enviada)
        run: python3 -W ignore ao_vivo.py
      - name: Guardar o estado no repositório
        run: |
          git config user.name "sala-robos"
          git config user.email "sala-robos@users.noreply.github.com"
          git add -A trader
          if git diff --cached --quiet; then echo "nada mudou"; exit 0; fi
          git commit -q -m "robôs: leitura $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do git pull -q --rebase && git push -q && exit 0; sleep 5; done
          exit 1
