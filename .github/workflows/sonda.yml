name: Sonda (testa as fontes de dados)
on:
  workflow_dispatch:
  push:
    paths: [".github/workflows/sonda.yml"]
permissions:
  contents: write
jobs:
  sonda:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Testar as fontes (só leitura de dados públicos)
        run: |
          python3 sondar.py > trader/vivo/sonda_github.txt 2>&1 || true
          curl -s -o /dev/null -w "yahoo_spy %{http_code}\n" -A "Mozilla/5.0" "https://query1.finance.yahoo.com/v8/finance/chart/SPY?range=5d&interval=1d" >> trader/vivo/sonda_github.txt
          curl -s -o /dev/null -w "binance_fapi_funding_hist %{http_code}\n" "https://fapi.binance.com/fapi/v1/fundingRate?symbol=BTCUSDT&limit=2" >> trader/vivo/sonda_github.txt
      - name: Guardar o resultado
        run: |
          git config user.name "sala-robos"; git config user.email "sala-robos@users.noreply.github.com"
          git add trader/vivo/sonda_github.txt trader/vivo/sonda.json
          git commit -q -m "sonda: resultado das fontes no GitHub" && git push -q || true
